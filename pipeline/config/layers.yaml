grocery_store_defaults: &grocery_store
  finnish_label: Ruokakaupan taustataso
  description: Valittavien ruokakaupparyhmien kävelymatkan taustatieto.
  kind: numeric
  unit: m
  formatter: integer
  allowed_categories: []
  allowed_min: 0
  allowed_max: null
  default_enabled: false
  default_weight: 1
  visualization_scale: sequential
  visualization_range: [0, 10000]
  methodology: Offline pedestrian-network distance to an OSM grocery-store group.
  caveat_ids: [routing-origin-fallback, osm-completeness]
  source_ids: [hsl_osm_extract]
  visible: false

layers:
  - layer_id: building_year
    finnish_label: Rakennusvuosi
    description: Rakennukseen liitetyt tunnetut rakennusvuodet.
    kind: numeric
    unit: year
    formatter: integer
    allowed_categories: []
    allowed_min: 1600
    allowed_max: 2100
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [1600, 2100]
    methodology: Direct building-record value with at-least-one-value matching.
    caveat_ids: [older-records-may-be-uncertain]
    source_ids: [hsy_buildings]
  - layer_id: house_type
    finnish_label: Talotyyppi
    description: Rakennuksen kanoninen talotyyppi.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories: [omakotitalo, paritalo, rivitalo, kerrostalo]
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Direct municipal Building Classification 2018 mapping where available; unmapped classes remain unknown.
    caveat_ids: [unmapped-codes-are-unknown]
    source_ids: [helsinki_buildings, vantaa_buildings]
  - layer_id: elevator
    finnish_label: Hissi
    description: Rakennusrekisteriin merkitty hissi.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories: [yes]
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Direct Helsinki building-register lift indicator; a blank indicator remains unknown.
    caveat_ids: [helsinki-only-building-register, unmapped-codes-are-unknown]
    source_ids: [helsinki_buildings]
  - layer_id: heating_method
    finnish_label: Lämmitystapa
    description: Rakennuksen pääasiallinen lämmitystapa.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories: [water_central, air_central, direct_electric, stove, no_fixed_heating]
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Direct Helsinki building-register code mapping for the main heating method.
    caveat_ids: [helsinki-only-building-register, unmapped-codes-are-unknown]
    source_ids: [helsinki_buildings]
  - layer_id: heating_energy_source
    finnish_label: Lämmitysenergian lähde
    description: Rakennuksen pääasiallinen lämmitysenergian lähde.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories: [district_or_local_heat, light_fuel_oil, heavy_fuel_oil, electricity, gas, coal_or_coke, wood, peat, ground_source_heat, other]
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Direct Helsinki building-register code mapping for the main heating energy source.
    caveat_ids: [helsinki-only-building-register, unmapped-codes-are-unknown]
    source_ids: [helsinki_buildings]
  - layer_id: storey_count
    finnish_label: Kerrosluku
    description: Rakennusrekisteriin merkitty kerrosluku.
    kind: numeric
    unit: krs
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 20]
    methodology: Direct Helsinki building-register storey count.
    caveat_ids: [helsinki-only-building-register]
    source_ids: [helsinki_buildings]
  - layer_id: dwelling_count
    finnish_label: Asuinhuoneistojen määrä
    description: Rakennusrekisteriin merkittyjen asuinhuoneistojen määrä.
    kind: numeric
    unit: kpl
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 200]
    methodology: Direct Helsinki building-register dwelling count.
    caveat_ids: [helsinki-only-building-register]
    source_ids: [helsinki_buildings]
  - layer_id: plot_tenure
    finnish_label: Tontin hallintamuoto
    description: Positiiviseen näyttöön perustuva tontin hallintamuoto.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories: [owned, leased, mixed]
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Positive land evidence only.
    caveat_ids: [evidence-based-not-title-search]
    source_ids: [espoo_city_land, vantaa_property_map, helsinki_lease_decisions]
  - layer_id: land_owner_class
    finnish_label: Maanomistus
    description: Positiiviseen näyttöön perustuva maan omistus.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories: [city, non_city]
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Positive licensed land-owner evidence only; absent or partial evidence is unknown.
    caveat_ids: [evidence-based-not-title-search]
    source_ids: [espoo_city_land]
  - layer_id: noise_day_upper_db
    finnish_label: Päivämelun yläraja
    description: Rakennuksen jalanjälkeen osuvien päiväajan meluvyöhykkeiden korkein julkaistu yläraja.
    kind: numeric
    unit: dB
    formatter: one_decimal
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [45, 75]
    methodology: Offline maximum db_hi of compatible LAeq 7-22 zones intersecting the footprint.
    caveat_ids: [modeled-indicative, zone-upper-bound-not-building-maximum, incompatible-vintages-not-merged]
    source_ids: [helsinki_noise_2022, espoo_noise_2022, metro_noise_2012_fallback]
  - layer_id: noise_night_upper_db
    finnish_label: Yömelun yläraja
    description: Rakennuksen jalanjälkeen osuvien yöajan meluvyöhykkeiden korkein julkaistu yläraja.
    kind: numeric
    unit: dB
    formatter: one_decimal
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [40, 70]
    methodology: Offline maximum db_hi of Helsinki LAeq 22-7 zones intersecting the footprint.
    caveat_ids: [modeled-indicative, zone-upper-bound-not-building-maximum, helsinki-only-noise]
    source_ids: [helsinki_noise_night_2022]
  # active_planning_area is not a scoreable layer: active detailed-plan areas ship
  # as a tickable vector map overlay (data/overlays/active-plans.geojson.gz), not a
  # per-building attribute. The helsinki_active_plans source stays for that overlay.
  - layer_id: forest_walk_m
    finnish_label: Kävelymatka metsään
    description: Lyhin kävelyreitin pituus lähimpään lähteen metsäksi luokittelemaan alueeseen.
    kind: numeric
    unit: m
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 5000]
    methodology: Offline pedestrian-network distance to a source-designated forest polygon.
    caveat_ids: [routing-origin-fallback, land-cover-resolution]
    source_ids: [hsy_land_cover_2022, hsl_osm_extract]
  - layer_id: shore_walk_m
    finnish_label: Kävelymatka merenrantaan
    description: Lyhin saavutettavan Itämeren rannan kävelyreitin pituus.
    kind: numeric
    unit: m
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 10000]
    methodology: Offline pedestrian-network distance to an accessible Baltic Sea shoreline.
    caveat_ids: [routing-origin-fallback, accessibility-evidence]
    source_ids: [hsl_osm_extract]
  - layer_id: daycare_walk_m
    finnish_label: Kävelymatka päiväkotiin
    description: Lyhin kävelyreitin pituus OSM:n päiväkoti- tai lastenhoitokohteeseen.
    kind: numeric
    unit: m
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 5000]
    methodology: Offline pedestrian-network distance to OSM amenity=kindergarten or amenity=childcare.
    caveat_ids: [routing-origin-fallback, osm-completeness]
    source_ids: [hsl_osm_extract]
  - layer_id: school_walk_m
    finnish_label: Kävelymatka kouluun
    description: Lyhin kävelyreitin pituus OSM:n koulukohteeseen.
    kind: numeric
    unit: m
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 5000]
    methodology: Offline pedestrian-network distance to OSM amenity=school.
    caveat_ids: [routing-origin-fallback, osm-completeness]
    source_ids: [hsl_osm_extract]
  - layer_id: healthcare_walk_m
    finnish_label: Kävelymatka terveyspalveluun
    description: Lyhin kävelyreitin pituus OSM:n terveyspalvelukohteeseen.
    kind: numeric
    unit: m
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 10000]
    methodology: Offline pedestrian-network distance to OSM amenity=clinic, doctors, or hospital.
    caveat_ids: [routing-origin-fallback, osm-completeness]
    source_ids: [hsl_osm_extract]
  - layer_id: library_walk_m
    finnish_label: Kävelymatka kirjastoon
    description: Lyhin kävelyreitin pituus OSM:n kirjastokohteeseen.
    kind: numeric
    unit: m
    formatter: integer
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 10000]
    methodology: Offline pedestrian-network distance to OSM amenity=library.
    caveat_ids: [routing-origin-fallback, osm-completeness]
    source_ids: [hsl_osm_extract]
  # transit_morning_worst_min ("Pisin paras aamumatka keskustaan") and
  # bike_central_min ("Pyöräilyaika keskustaan") were removed: the Aamumatka /
  # Pyörämatka commute layers to the "rautatieasema" destination already cover
  # transit and bike travel to the centre.
  - <<: *grocery_store
    layer_id: grocery_store_prisma_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_k_citymarket_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_lidl_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_s_market_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_k_supermarket_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_sale_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_k_market_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_alepa_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_other_supermarket_walk_m
  - <<: *grocery_store
    layer_id: grocery_store_other_grocery_walk_m
  - layer_id: income_median_eur
    finnish_label: Alueen mediaanitulot
    description: Postinumeroalueen kotitalouksien mediaanitulot.
    kind: numeric
    unit: EUR
    formatter: currency
    allowed_categories: []
    allowed_min: 0
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [0, 100000]
    methodology: Offline postal-area assignment; suppressed source values are unknown.
    caveat_ids: [postal-area-context, suppressed-values-unknown]
    source_ids: [paavo_income]
