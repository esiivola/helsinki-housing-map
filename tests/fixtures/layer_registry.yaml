layers:
  - layer_id: building_year
    finnish_label: Rakennusvuosi
    description: Rakennukseen liitetyt tunnetut rakennusvuodet.
    kind: numeric
    unit: year
    formatter: integer
    allowed_categories: []
    allowed_min: 1600
    allowed_max: 2100
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [1600, 2100]
    methodology: Direct building-record value.
    caveat_ids:
      - older-records-may-be-uncertain
    source_ids:
      - hsy_buildings
  - layer_id: plot_tenure
    finnish_label: Tontin hallintamuoto
    description: Positiiviseen näyttöön perustuva tontin hallintamuoto.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories:
      - owned
      - leased
      - mixed
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Positive land evidence only.
    caveat_ids:
      - evidence-based-not-title-search
    source_ids:
      - espoo_city_land
