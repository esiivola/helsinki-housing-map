layers:
  - layer_id: building_year
    finnish_label: Rakennusvuosi
    description: Rakennukseen liitetyt tunnetut rakennusvuodet.
    kind: numeric
    unit: year
    formatter: integer
    allowed_categories: []
    allowed_min: 1600
    allowed_max: 2100
    default_enabled: false
    default_weight: 1
    visualization_scale: sequential
    visualization_range: [1600, 2100]
    methodology: Direct building-record value.
    caveat_ids:
      - older-records-may-be-uncertain
    source_ids:
      - hsy_buildings
  - layer_id: land_owner_class
    finnish_label: Maanomistus
    description: Kaupungin tai muun omistajan luokitus.
    kind: categorical
    unit: null
    formatter: label
    allowed_categories:
      - city
      - non_city
    allowed_min: null
    allowed_max: null
    default_enabled: false
    default_weight: 1
    visualization_scale: discrete
    visualization_range: null
    methodology: Derived city-or-other owner classification.
    caveat_ids:
      - evidence-based-not-title-search
    source_ids:
      - espoo_city_land
