name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download verified public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r .tag web/public-data-release.json)
          asset=$(jq -r .asset web/public-data-release.json)
          sha256=$(jq -r .sha256 web/public-data-release.json)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "$sha256  $RUNNER_TEMP/$asset" | sha256sum --check --status
          mkdir -p web/public
          tar -xzf "$RUNNER_TEMP/$asset" -C web/public
      - name: Build site
        run: |
          cd web
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
